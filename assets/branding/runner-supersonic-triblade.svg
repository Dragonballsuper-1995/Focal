<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Runner Variant B: The Supersonic Tri-Blade (Kinetic Slipstream) -->
  <defs>
    <linearGradient id="triblade-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>

    <!-- Solar Velocity Gradient -->
    <linearGradient id="blade-lead" x1="30" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#FF4D00"/>
      <stop offset="100%" stop-color="#D92200"/>
    </linearGradient>

    <linearGradient id="blade-mid" x1="20" y1="20" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <linearGradient id="blade-tail" x1="10" y1="20" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="100" height="100" rx="24" fill="url(#triblade-bg)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="23.25" stroke="#252A36" stroke-width="1.5"/>

  <!-- Blade 1: Rear Titanium Stabilizer Blade -->
  <path d="M 22 30 L 34 30 L 22 70 L 10 70 Z" fill="url(#blade-tail)"/>

  <!-- Blade 2: Intermediate Aerodynamic Wing (Forming R Chevron) -->
  <path d="M 40 24 L 54 24 L 38 76 L 24 76 Z" fill="url(#blade-mid)"/>

  <!-- Blade 3: Leading Supersonic Interceptor Blade -->
  <path d="M 60 20 L 76 20 L 56 80 L 40 80 Z" fill="url(#blade-lead)"/>

  <!-- Specular Leading Edge on Main Blade -->
  <line x1="76" y1="20" x2="56" y2="80" stroke="#FFE484" stroke-width="2" stroke-linecap="round"/>

  <!-- Velocity Sonic Wake Lines -->
  <line x1="58" y1="50" x2="88" y2="50" stroke="#FF7A00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="62" x2="82" y2="62" stroke="#FFA800" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="38" x2="85" y2="38" stroke="#FFE484" stroke-width="1" stroke-linecap="round"/>

  <!-- Telemetry Speed Readout Tag -->
  <circle cx="88" cy="50" r="2" fill="#FFFFFF"/>
</svg>
