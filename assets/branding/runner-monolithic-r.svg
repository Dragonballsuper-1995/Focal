<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Runner Variant A: The Monolithic Kinetic R -->
  <defs>
    <linearGradient id="r-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>

    <!-- Kinetic Blade Gradient (Cyan / Cobalt Velocity) -->
    <linearGradient id="r-blade-grad" x1="42" y1="46" x2="80" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Loop Gradient -->
    <linearGradient id="r-loop-grad" x1="24" y1="22" x2="72" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Titanium Spine Gradient -->
    <linearGradient id="r-spine-grad" x1="22" y1="22" x2="38" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#263147"/>
      <stop offset="100%" stop-color="#141A26"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#r-bg)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="23.25" stroke="#1D2436" stroke-width="1.5"/>

  <!-- Subtle Speed Telemetry Grid in Background -->
  <line x1="20" y1="78" x2="80" y2="78" stroke="#1C2436" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="80" y1="22" x2="80" y2="78" stroke="#1C2436" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- MONOGRAM "R" GEOMETRY -->

  <!-- 1. The Vertical Spine (Heavy Titanium Pillar) -->
  <path d="M24 22 H38 V78 H24 V22 Z" fill="url(#r-spine-grad)"/>
  <line x1="38" y1="22" x2="38" y2="78" stroke="#334155" stroke-width="0.75"/>

  <!-- 2. The Upper Aerodynamic Loop -->
  <path d="M38 22 H58 C68 22, 74 28, 74 37 C74 46, 68 52, 58 52 H38 V22 Z" fill="url(#r-loop-grad)"/>
  <!-- Inner Negative-Space Aperture of R -->
  <path d="M38 32 H55 C60 32, 62 34, 62 37 C62 40, 60 42, 55 42 H38 V32 Z" fill="#0E1117"/>

  <!-- 3. The Forward-Thrusting Kinetic Stride Blade (Kick Vector) -->
  <path d="M46 48 L64 48 L80 78 H62 L46 48 Z" fill="url(#r-blade-grad)"/>
  
  <!-- Laser Leading-Edge Highlight -->
  <line x1="64" y1="48" x2="80" y2="78" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Micro Accelerating Vector Node -->
  <circle cx="80" cy="78" r="2.5" fill="#38BDF8"/>
  <line x1="72" y1="78" x2="76" y2="78" stroke="#38BDF8" stroke-width="1.5"/>
</svg>
